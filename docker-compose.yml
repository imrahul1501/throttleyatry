version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: throtalyatry-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ENVIRONMENT=production
      - NODE_ENV=production
    volumes:
      # Mount static files
      - ./:/usr/share/nginx/html:ro
      # Mount logs
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - throtalyatry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  throtalyatry-network:
    driver: bridge
